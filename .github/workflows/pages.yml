# Publishes the claim page to GitHub Pages whenever its data or code changes.
# One-time setup: Settings > Pages > Source: GitHub Actions.
name: Claim page

on:
  push:
    branches: [main]
    paths: ["site/**", "wallet/**", "airdrop/**", "deployments/**", "scripts/build-site.js", "scripts/tokenomics.js"]
  # Deploy and Airdrop commit with the workflow token, which doesn't trigger push
  # events, so rebuild after they finish too.
  workflow_run:
    workflows: [Deploy, Airdrop]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # the latest main, including what Deploy or Airdrop just committed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            wallet/package-lock.json
      - run: npm ci
      - run: npm ci --prefix wallet
      - run: node scripts/build-site.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
