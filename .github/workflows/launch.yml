# Opens trading from the Actions tab: creates the 1% KUJI/WETH Uniswap pool at the starting
# market cap with the operator wallet's KUJI on one side only (no ETH needed), minted straight
# into KujiraLiquidityLock. Run it right after Deploy. Uses PRIVATE_KEY; the wallet needs a
# little ETH for gas.
name: Launch pool

on:
  workflow_dispatch:
    inputs:
      network:
        description: Network
        type: choice
        options: [ink]
        default: ink
      market_cap_usd:
        description: Starting market cap in USD
        required: true
        default: "15500"
      eth_usd:
        description: ETH price in USD (leave empty to use Kraken's price)
        required: false
      confirm:
        description: Type LAUNCH to confirm
        required: true

permissions:
  contents: write

concurrency: deploy-${{ inputs.network }}

jobs:
  launch:
    runs-on: ubuntu-latest
    env:
      NETWORK: ${{ inputs.network }}
      CONFIRM: ${{ inputs.confirm }}
      MARKET_CAP_USD: ${{ inputs.market_cap_usd }}
      ETH_USD: ${{ inputs.eth_usd }}
    steps:
      - name: Check confirmation
        run: |
          if [ "$CONFIRM" != "LAUNCH" ]; then echo "Type LAUNCH to confirm"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Launch
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: npx hardhat run scripts/launch-pool.js --network "$NETWORK"
      - name: Save launch details
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Launch the KUJI pool on $NETWORK"
          git push
